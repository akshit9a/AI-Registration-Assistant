<!DOCTYPE html>
<html>
<head>
    <title>AI Registration Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            text-align: center;
        }

        #chatbox {
            height: 350px;
            border: 1px solid #cccccc;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .assistant {
            text-align: left;
            margin: 10px;
        }

        input {
            width: 75%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Registration Assistant</h1>

    <div id="chatbox">
        <div class="assistant">
            <b>Assistant:</b>
            Hello! Welcome to the AI Registration Assistant.
            How can I help you?
        </div>
    </div>

    <input
        type="text"
        id="message"
        placeholder="Type your message..."
    >

    <button onclick="sendMessage()">Send</button>

</div>

<script>

function sendMessage() {

    let message = document.getElementById("message").value;

    if (message.trim() === "") {
        return;
    }

    let chatbox = document.getElementById("chatbox");

    chatbox.innerHTML +=
        "<div class='user'><b>You:</b> "
        + message
        + "</div>";

    fetch("/chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })

    })

    .then(response => response.json())

    .then(data => {

        chatbox.innerHTML +=
            "<div class='assistant'><b>Assistant:</b> "
            + data.response
            + "</div>";

        chatbox.scrollTop = chatbox.scrollHeight;

    });

    document.getElementById("message").value = "";
}

</script>

</body>
</html>
